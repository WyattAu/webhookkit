[package]
name = "webhookkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Webhook signature verification for Rust — HMAC-SHA256, timestamp validation, and provider-specific parsers for Stripe, GoCardless, and more"
readme = "README.md"
repository = "https://github.com/WyattAu/webhookkit"

[dependencies]
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["hmac-sha256"]
hmac-sha256 = []

[dev-dependencies]
