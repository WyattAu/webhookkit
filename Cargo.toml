[package]
name = "webhookkit"
version = "2.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Webhook signature verification for Rust — HMAC-SHA256, timestamp validation, and provider-specific parsers for Stripe, GoCardless, and more"
readme = "README.md"
repository = "https://github.com/WyattAu/webhookkit"
keywords = ["webhook", "hmac", "verification"]
categories = ["web-programming"]
exclude = ["/target"]

[dependencies]
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
subtle = { version = "2", default-features = false }
thiserror = { version = "2", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"], optional = true }
# Replay-guard storage: the estate's single claim primitive. The memory
# store backs `ReplayGuard` (under `std`); the Redis store backs
# `RedisReplayGuard` (under `redis`). Optional and feature-activated so
# the no_std core never pulls it.
idempotency-kit = { version = "0.1", default-features = false, optional = true }

[features]
default = ["std", "hmac-sha256"]
# webhookkit keeps its own `redis` dependency for the `ConnectionManager`
# constructor parameter; the same 0.27 line as idempotency-kit's, so the
# types unify in the graph.
redis = ["dep:redis", "idempotency-kit/redis"]
# Core-only build: stateless HMAC verification, GoCardless parsing, and the
# `ffi` surface need no std. `timestamp`/`replay`/`stripe` need a wall clock
# (SystemTime) and/or std, so they require `std`; `replay` additionally
# stores its claims in `idempotency-kit`'s `MemoryStore`.
std = ["dep:idempotency-kit", "idempotency-kit/memory"]
hmac-sha256 = []
ffi = []

[dev-dependencies]
proptest = "1"
# integration.rs signing helpers (mirror the runtime crypto stack).
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
# redis_replay.rs: a throwaway Redis per test run (docker).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
testcontainers = "0.24"
testcontainers-modules = { version = "0.12", features = ["redis"] }

[[test]]
name = "redis_replay"
required-features = ["redis"]

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
