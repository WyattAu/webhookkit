[package]
name = "webhookkit"
version = "1.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Webhook signature verification for Rust — HMAC-SHA256, timestamp validation, and provider-specific parsers for Stripe, GoCardless, and more"
readme = "README.md"
repository = "https://github.com/WyattAu/webhookkit"
keywords = ["webhook", "hmac", "verification"]
categories = ["web-programming"]
exclude = ["/target"]

[dependencies]
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
subtle = { version = "2", default-features = false }
thiserror = { version = "2", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"], optional = true }
tokio = { version = "1", optional = true }

[features]
default = ["std", "hmac-sha256"]
redis = ["dep:redis", "dep:tokio"]
# Core-only build: stateless HMAC verification, GoCardless parsing, and the
# `ffi` surface need no std. `timestamp`/`replay`/`stripe` need a wall clock
# (SystemTime) and/or std Mutex, so they require `std`.
std = []
hmac-sha256 = []
ffi = []

[dev-dependencies]
proptest = "1"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
