[package]
name = "webhookkit-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
webhookkit = { path = ".." }

[[bin]]
name = "fuzz_verify_hmac"
path = "fuzz_targets/fuzz_verify_hmac.rs"
test = false
doc = false

[[bin]]
name = "fuzz_verify"
path = "fuzz_targets/fuzz_verify.rs"
test = false
doc = false
